# =============================================================================
# TREVOR – AI SOFTWARE STUDIO & MULTI-AGENT COMMAND CENTER
# RENDER DEPLOYMENT BLUEPRINT (render.yaml)
# =============================================================================

services:
  - type: web
    name: trevor-ai-studio
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --production
    startCommand: node 06_Deployment_und_Config/server.js
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3
